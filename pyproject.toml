[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remasep-automation"
version = "0.1.0"
description = "Automatización local de informes REMASEP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "PyYAML>=6,<7",
    "PySide6>=6.8,<7",
    "openpyxl>=3.1,<4",
    "olefile>=0.46,<1",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9",
]
# Sólo para construir el ejecutable Windows (Sprint 3.11). NO es una
# dependencia de runtime del usuario final: el .exe empaquetado no lo incluye.
build = [
    "pyinstaller>=6,<7",
]

[project.scripts]
remasep = "remasep.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "excel: integration test that needs Microsoft Excel Desktop on Windows (skipped elsewhere)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
